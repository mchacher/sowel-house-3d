name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # NOTE: the `name:` below is the check name the `main-protection` ruleset
  # requires. Renaming it silently stops it from gating merges.
  check:
    name: App (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  specs:
    name: Specs completeness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need main's history for the merge-base diff
      - name: Every new spec folder has spec.md + architecture.md + plan.md
        run: bash scripts/check-specs-complete.sh
      - name: Every spec folder has a row in the index
        run: bash scripts/check-specs-index.sh
